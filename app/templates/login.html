<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Microgreens – Staff Login</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/sprout.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { djgreen: { 50: '#f0fdf4', 100: '#dcfce7', 700: '#15803d', 800: '#166534', 900: '#14532d' } } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-djgreen-900 via-emerald-900 to-slate-900 flex items-center justify-center p-4 text-slate-800 antialiased">

  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="flex items-center justify-center space-x-3 mb-6 text-white">
      <div class="w-11 h-11 rounded-2xl bg-emerald-500/20 border border-emerald-400 flex items-center justify-center text-emerald-300">
        <i data-lucide="sprout" class="w-6 h-6"></i>
      </div>
      <div>
        <div class="font-extrabold text-lg tracking-wide">DJ MICROGREENS</div>
        <div class="text-xs text-emerald-300/80">Staff & Management Portal</div>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 space-y-5">
      <div>
        <h1 class="text-xl font-black text-slate-900">Sign in</h1>
        <p class="text-xs text-slate-500 mt-1">One login for all management roles.</p>
      </div>

      <div class="flex flex-wrap gap-1.5 text-[10px] font-bold">
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100">Super Admin</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100">Operations Manager</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100">Farm Manager</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100">Inventory Manager</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100">Delivery Manager</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100">Sales & B2B Manager</span>
      </div>

      <form id="loginForm" class="space-y-4 text-sm">
        <div>
          <label for="username" class="block text-xs font-bold text-slate-600 mb-1">Username</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="username" name="username" type="text" required autocomplete="username" autofocus
              class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
        <div>
          <label for="password" class="block text-xs font-bold text-slate-600 mb-1">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="password" name="password" type="password" required autocomplete="current-password"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-10 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button type="button" id="togglePw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700" aria-label="Show password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <p id="loginError" class="hidden text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2"></p>

        <button id="loginBtn" type="submit" class="w-full bg-djgreen-800 hover:bg-djgreen-900 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Sign in</span>
        </button>
      </form>

      <p class="text-[11px] text-slate-400 text-center">Forgot your password? Ask the Super Admin to reset it.</p>
    </div>

    <p class="text-center mt-4"><a href="/" class="text-xs text-emerald-200 hover:text-white">← Back to storefront</a></p>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Sign in failed');
        window.location.href = '/admin';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
